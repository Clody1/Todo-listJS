<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
      <h1>Mon premier utilisation js DOM</h1>
      <form id="todoForm">
        <input type="texte" id="taskInput" placeholder="Ajouter une tache" required> 

        <button type="submit">Ajouter</button>

      </form>

      <div class="filters">
        <button id="allBtn">Toutes</button>

        <button id="activeBtn">Actives</button>

        <button id="completedBtn">Copmletees</button>
      </div>

      <ul id="taskList">

      </ul>
      <p id="taskcounter">Taches restantes : 0</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
